name: Build win64-app (program + FFmpeg)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Windows x64 runner label (VS 2022, at least 4 GiB free)'
        type: string
        default: windows-2022
        required: true

permissions:
  contents: read

concurrency:
  group: win64-app-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Compile, test and package program with FFmpeg
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      reports_id: ${{ steps.reports.outputs.artifact-id }}
      archive_name: ${{ steps.package.outputs.archive_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select work volume
        id: disk
        run: ./scripts/ci-workspace.ps1 -MinimumFreeGiB 4
      - name: Test packaging and Release publication
        run: |
          python -X utf8 -m unittest discover -s tests -p test_app_package.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Application packaging tests failed.' }
          python -X utf8 -m unittest discover -s tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Release publication tests failed.' }
      - name: Build Release and run native tests
        env:
          BUILD_WORK: ${{ steps.disk.outputs.work }}
        run: ./scripts/build-win64-nv.ps1 -WorkDirectory $env:BUILD_WORK
      - name: Package program with verified FFmpeg and test relocated GUI
        id: package
        env:
          BUILD_WORK: ${{ steps.disk.outputs.work }}
        run: |
          python -X utf8 ./scripts/package_win64_app.py --work $env:BUILD_WORK
          if ($LASTEXITCODE -ne 0) { throw 'Application packaging or verification failed.' }
      - name: Upload application ZIP
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Preserve checksums and test reports
        id: reports
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win64-app-reports-${{ github.run_id }}
          path: |
            ${{ steps.disk.outputs.work }}/reports/**
            ${{ steps.disk.outputs.work }}/artifacts/*.sha256
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
      - name: Clean this runner work directory
        if: ${{ always() && steps.disk.outcome == 'success' }}
        env:
          BUILD_WORK: ${{ steps.disk.outputs.work }}
        run: ./scripts/ci-clean-work.ps1 -WorkDirectory $env:BUILD_WORK

  release:
    name: Publish program ZIP to GitHub Release
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select release work volume
        id: disk
        run: ./scripts/ci-workspace.ps1 -MinimumFreeGiB 2
      - name: Restore original ZIP without extracting it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.disk.outputs.work }}/archive
          skip-decompress: true
      - name: Restore archive checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.reports_id }}
          path: ${{ steps.disk.outputs.work }}/reports
      - name: Verify uploads and publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORK: ${{ steps.disk.outputs.work }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
        run: |
          $archive = Join-Path $env:BUILD_WORK ('archive/' + $env:ARCHIVE_NAME)
          $checksums = @(Get-ChildItem -LiteralPath (Join-Path $env:BUILD_WORK 'reports') -Recurse -File |
            Where-Object { $_.Name -eq $env:ARCHIVE_NAME + '.sha256' })
          if ($checksums.Count -ne 1) { throw 'Expected exactly one archive checksum from the build job.' }
          python -X utf8 ./scripts/publish_release.py --target win64-app --archive $archive --checksum $checksums[0].FullName --repository $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; rerun failed jobs to resume the draft.' }
      - name: Clean this runner work directory
        if: ${{ always() && steps.disk.outcome == 'success' }}
        env:
          BUILD_WORK: ${{ steps.disk.outputs.work }}
        run: ./scripts/ci-clean-work.ps1 -WorkDirectory $env:BUILD_WORK
